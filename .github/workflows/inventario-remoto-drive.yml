name: Inventario remoto ZIP RAR regioes
on:
  push:
    branches:
      - feature/validacao-geografica-externa
    paths:
      - 'experimentos/validacao_externa_regioes/inspecionar_arquivos_remotos.py'
      - '.github/workflows/inventario-remoto-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ler-diretorios-sem-download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar somente biblioteca de leitura de RAR
        run: python -m pip install -q rarfile tifffile
      - name: Inspecionar central de ZIP e cabecalhos de RAR usando leituras limitadas
        run: |
          python experimentos/validacao_externa_regioes/inspecionar_arquivos_remotos.py \
            --limite-mb 32 \
            --out "${{ runner.temp }}/inventario-remoto"
      - uses: actions/upload-artifact@v4
        with:
          name: inventario-remoto-zip-rar
          path: ${{ runner.temp }}/inventario-remoto/inventario_zip_rar_remoto.json
          retention-days: 7
