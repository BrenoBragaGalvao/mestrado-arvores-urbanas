name: Verificar acesso ao Drive sem login
on:
  push:
    branches:
      - feature/validacao-geografica-externa
    paths:
      - '.github/workflows/verificar-acesso-drive-sem-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-leitura-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspecionar respostas HTTP sem baixar os arquivos compactados
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          import urllib.parse
          import json
          ids={
              "CENTRO_NOVO_HAMBURGO":"1UufzP5quG1tRDgfkuwzJ9evwvIHgitYT",
              "LOMBA_GRANDE_NOVO_HAMBURGO":"1N5peFz-NauAYeNgBcauFyX9reJpnROQ6",
              "CRISTO_REI_SAO_LEOPOLDO":"1HR1PYH8T38SviYIgcOKb5y0QAag9QdKU",
              "SAGRADA_FAMILIA_CAXIAS":"1S5gKEFuGyKZtvq4Q33xcCkndwLIrUg91"
          }
          for region, identifier in ids.items():
              url="https://drive.google.com/uc?export=download&id="+urllib.parse.quote(identifier)
              req=urllib.request.Request(url, headers={
                   "Range":"bytes=0-511", "User-Agent":"Mozilla/5.0", "Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      first=r.read(512)
                      mime=r.headers.get("Content-Type","")
                      effective=r.url
                      content_disposition=bool(r.headers.get("Content-Disposition"))
                      binary_signature=first.startswith(b"PK") or first.startswith(b"Rar!")
                      body=first.lower()
                      has_google_warning=any(t in body for t in (b"confirm",b"download anyway",b"cannot scan"))
                      has_login=any(t in body for t in (b"sign in",b"login",b"accounts.google.com",b"request access"))
                      result={"region":region,"status":r.status,"mime":mime,
                              "host":urllib.parse.urlparse(effective).hostname,
                              "attachment_header":content_disposition,
                              "archive_signature":binary_signature,
                              "google_download_confirmation":has_google_warning,
                              "login_or_access_request":has_login}
                      print(json.dumps(result,ensure_ascii=False),flush=True)
              except Exception as exc:
                  print(json.dumps({"region":region,"error_type":type(exc).__name__,
                                    "message":str(exc)[:180]},ensure_ascii=False),flush=True)
          print("Verificação somente de metadados HTTP. NENHUM pacote foi baixado.")
          PY
