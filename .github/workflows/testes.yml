name: Validacao do notebook (testes sintéticos)
on:
  push:
    branches: [main]
    paths:
      - 'Segmentacao_area_completa.ipynb'
      - 'Segmentacao_area_completa_2026.ipynb'
      - 'Segmentacao_classificacao.ipynb'
      - 'tests/**'
      - 'requirements-colab.txt'
      - 'README.md'
      - 'data/README.md'
      - 'docs/*.md'
      - '.github/workflows/testes.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-colab.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-colab.txt
      - name: Smoke tests on synthetic rasters and vectors
        run: python -m unittest discover -v -s tests -p "test_*.py"
