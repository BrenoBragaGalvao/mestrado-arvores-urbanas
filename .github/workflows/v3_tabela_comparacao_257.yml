name: "V3 - Tabela Meta C1-C6 log e potencia nos 257 pontos"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3_tabela_comparacao_257.yml"
      - "experimentos/v3_tabela_meta_c1_c6_log_pot.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: python -m pip install pandas numpy
      - name: Calcular 257 pontos C1-C6 potenciais lineares logaritmica e potencia ajustada
        run: |
          python experimentos/v3_tabela_meta_c1_c6_log_pot.py \
            --pontos docs/v3_alturas_publicas/v3_comparacao_c3_meta_257.csv \
            --parametros docs/v3_alturas_publicas/v3_meta_calibracao_parametros_e_limites.json \
            --out docs/v3_alturas_publicas
      - name: Publicar resultados reproduzidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v3_alturas_publicas/v3_comparacao_c1_c6_log_pot_meta_257.csv docs/v3_alturas_publicas/v3_comparacao_completa_c1_c6_pot_linear_log_meta_257.csv docs/v3_alturas_publicas/v3_comparacao_c1_c6_log_pot_resumo.csv
          git diff --cached --quiet || (git commit -m "data(v3): reproduz 257 alturas Meta versus C1-C6 e log e potencia" && git push)
      - name: Disponibilizar planilhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-tabela-meta-c1-c6-log-pot-257
          path: docs/v3_alturas_publicas/v3_comparacao_*
          if-no-files-found: ignore
