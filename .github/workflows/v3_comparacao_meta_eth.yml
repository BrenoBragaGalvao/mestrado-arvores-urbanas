name: "V3 - Comparar alturas estimadas Meta e ETH Zurich"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3_comparacao_meta_eth.yml"
      - "experimentos/v3_comparar_meta_eth_257.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  comparar_dossel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check numpy pandas rasterio requests matplotlib
      - name: Amostrar mapa ETH 2020 e comparar 257 pontos Meta
        env:
          GDAL_HTTP_TIMEOUT: "40"
          GDAL_HTTP_MAX_RETRY: "4"
          GDAL_HTTP_RETRY_DELAY: "2"
        run: |
          python -u experimentos/v3_comparar_meta_eth_257.py \
            --meta docs/v3_alturas_publicas/v3_comparacao_c3_meta_257.csv \
            --out docs/v3_alturas_publicas/
      - name: Publicar resultados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v3_alturas_publicas/v3_meta_eth*
          git diff --cached --quiet || (git commit -m "data(v3): compara alturas modeladas Meta e ETH nos 257 pontos" && git push)
      - name: Anexar resultados, mesmo em caso de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-comparacao-meta-eth
          path: docs/v3_alturas_publicas/v3_meta_eth*
          if-no-files-found: ignore
