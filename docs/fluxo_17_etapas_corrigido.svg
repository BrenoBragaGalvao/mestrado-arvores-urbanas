<text x="737" y="621" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Carregar e recortar postes</text>
<text x="737" y="643" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">postes.gpkg • reprojeção e AOI</text>
