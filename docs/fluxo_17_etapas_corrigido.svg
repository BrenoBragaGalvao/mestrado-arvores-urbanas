<text x="65" y="179" font-family="DejaVu Sans, Arial" font-size="18" fill="#dbeafe">Identificar árvores e gramíneas</text>
<text x="690" y="155" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="#fff">PROPOSTA 2</text>
<text x="690" y="179" font-family="DejaVu Sans, Arial" font-size="18" fill="#dcfce7">Porte exploratório e proximidade com postes</text>
