<text x="113" y="399" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Gerar polígonos e recortar AOI</text>
<text x="113" y="421" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">Segmentos transformados em objetos</text>
<rect x="49" y="453" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="467" width="38" height="38" rx="10" fill="#2563eb"/>
