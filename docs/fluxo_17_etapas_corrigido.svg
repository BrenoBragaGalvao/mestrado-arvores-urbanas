<text x="707" y="892" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#854d0e">ATENÇÃO AO CÓDIGO</text>
<text x="707" y="920" font-family="DejaVu Sans, Arial" font-size="14" fill="#713f12">A Proposta 2 reutiliza os candidatos do cluster 3,</text>
<text x="707" y="944" font-family="DejaVu Sans, Arial" font-size="14" fill="#713f12">não apenas os objetos previstos como árvore.</text>
<rect x="690" y="994" width="534" height="125" rx="13" fill="#dcfce7" stroke="#86efac"/>
<text x="707" y="1023" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#14532d">LIMITES DE INTERPRETAÇÃO</text>
<text x="707" y="1052" font-family="DejaVu Sans, Arial" font-size="14" fill="#166534">C3 é um índice empírico, não altura validada.</text>
<text x="707" y="1075" font-family="DejaVu Sans, Arial" font-size="14" fill="#166534">A distância é 2D até postes, não até cabos.</text>
<text x="707" y="1098" font-family="DejaVu Sans, Arial" font-size="14" fill="#166534">Não indica risco elétrico comprovado.</text>
<text x="54" y="1254" font-family="DejaVu Sans, Arial" font-size="15" fill="#475569">Linha amarela tracejada: candidatos do cluster 3 usados na Proposta 2 (independentemente da classe prevista).</text>
<text x="54" y="1285" font-family="DejaVu Sans, Arial" font-size="15" fill="#475569">Representação do notebook original; não inclui experimentos posteriores em quadrantes da V2.</text>
