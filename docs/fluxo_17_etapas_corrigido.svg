<text x="113" y="480" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Extrair estatísticas RGB + NIR</text>
<text x="113" y="502" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">4 médias e 4 desvios-padrão por objeto</text>
<rect x="49" y="534" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="548" width="38" height="38" rx="10" fill="#2563eb"/>
