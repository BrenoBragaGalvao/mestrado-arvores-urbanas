<text x="113" y="642" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Selecionar candidatos</text>
<text x="113" y="664" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">Somente objetos do cluster 3</text>
<rect x="49" y="696" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="710" width="38" height="38" rx="10" fill="#2563eb"/>
