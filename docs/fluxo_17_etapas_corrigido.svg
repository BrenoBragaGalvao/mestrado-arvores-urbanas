<text x="113" y="318" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Segmentar com Quickshift</text>
<text x="113" y="340" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">kernel=3 • max_dist=5 • ratio=0,04</text>
<rect x="49" y="372" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="386" width="38" height="38" rx="10" fill="#2563eb"/>
