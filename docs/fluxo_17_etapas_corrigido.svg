<text x="737" y="419" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">Modelos empíricos C1–C6</text>
<rect x="673" y="482" width="568" height="86" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<rect x="685" y="496" width="38" height="38" rx="10" fill="#15803d"/>
