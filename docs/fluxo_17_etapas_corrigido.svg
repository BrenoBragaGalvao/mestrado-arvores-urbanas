<text x="80" y="249" font-family="DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">01</text>
<text x="113" y="237" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Abrir imagem RGB</text>
<text x="113" y="259" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">AOI_RGB_NEW.tif • 3 bandas</text>
<rect x="49" y="291" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="305" width="38" height="38" rx="10" fill="#2563eb"/>
