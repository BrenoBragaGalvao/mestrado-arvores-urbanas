<text x="113" y="1047" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Treinar Random Forest</text>
<text x="113" y="1069" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">500 árvores • seed 42</text>
