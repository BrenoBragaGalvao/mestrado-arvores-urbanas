<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="48" y="56" font-family="DejaVu Sans, Arial" font-size="30" font-weight="bold" fill="#0f172a">Fluxo do método original — 17 etapas</text>
<text x="48" y="85" font-family="DejaVu Sans, Arial" font-size="18" fill="#475569">Base Area1 • duas propostas • representação da lógica do código histórico</text>
<rect x="32" y="113" width="598" height="1108" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
