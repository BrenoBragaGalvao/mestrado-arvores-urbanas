<text x="113" y="723" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Associar referências</text>
<text x="113" y="745" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">Interseção com árvores e gramíneas</text>
<rect x="49" y="777" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="791" width="38" height="38" rx="10" fill="#2563eb"/>
