<text x="113" y="561" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#0f172a">Aplicar K-Means</text>
<text x="113" y="583" font-family="DejaVu Sans, Arial" font-size="14" fill="#475569">6 agrupamentos • random_state=42</text>
<rect x="49" y="615" width="562" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="61" y="629" width="38" height="38" rx="10" fill="#2563eb"/>
