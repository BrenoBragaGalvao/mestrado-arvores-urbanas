<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="1230" viewBox="0 0 1980 1230" role="img" aria-labelledby="t d">
<title id="t">Pipeline completo — 17 etapas, duas propostas e oito classificadores</title>
<desc id="d">Fluxograma ampliado da Area1. Proposta 1: 812 quadrantes de até 256 pixels, Quickshift, 505 segmentos rotulados, atributos NDVI, brilho HSV e Canny, validação espacial de 250 e 500 metros com exclusão de 25 metros, oito classificadores e F1-macro. Proposta 2: análise complementar exploratória de 257 pontos com Meta/WRI, onze famílias alométricas, índices históricos C1–C6 e proximidade bidimensional aos postes.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#68819C"/></marker></defs>
<rect width="1980" height="1230" fill="#FAFCFF"/>
<rect x="22" y="18" width="1936" height="120" rx="20" fill="#133E69"/>
<text x="990" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="white">Pipeline completo da pesquisa — 17 etapas</text>
<text x="990" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#E1F0FF">Duas propostas complementares • configuração principal: Quickshift em 812 quadrantes • oito classificadores</text>
<rect x="22" y="156" width="1936" height="805" rx="18" stroke="#B8CADC" stroke-width="2" fill="white"/>
<text x="56" y="206" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#123E65">PROPOSTA 1 — Identificação de árvores e gramíneas</text>
<text x="55" y="246" font-family="Arial,sans-serif" font-size="21" fill="#4B6883">As caixas apresentam a ordem das etapas; as três primeiras linhas descrevem preparação, segmentação, classificação e validação.</text>
<rect x="22" y="980" width="1936" height="224" rx="18" stroke="#A4A9DB" stroke-width="2" fill="#F7F7FE"/>
<text x="55" y="1023" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#3E4489">PROPOSTA 2 — Porte e proximidade com postes</text>
<text x="55" y="1053" font-family="Arial,sans-serif" font-size="19" fill="#60658F">Análise exploratória complementar; as alturas Meta/WRI são modeladas, e a distância 2D não comprova risco elétrico.</text>
<rect x="48" y="270" width="448" height="111" rx="15" fill="#E8F3FF" stroke="#6BA3D5" stroke-width="2"/>
<circle cx="79" cy="300" r="19" fill="#6BA3D5"/>
