<text x="287" y="332.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="500" fill="#15517E">RGB e RGB + NIR</text>
<text x="287" y="360.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="500" fill="#15517E">Caxias do Sul (RS)</text>
