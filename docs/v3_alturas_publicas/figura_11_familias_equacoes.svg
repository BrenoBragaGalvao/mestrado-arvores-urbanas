<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 890" role="img" aria-labelledby="title desc">
<title id="title">Onze famílias de equações do artigo de Chatziathanasiou et al. 2024</title>
<desc id="desc">Fórmulas matemáticas que relacionam largura da copa e altura para onze famílias de modelos: linear, logarítmica, inversa, quadrática, cúbica, potência, composta, curva S, logística, crescimento e exponencial.</desc>
<style>
.title{font:700 31px "DejaVu Sans",Arial,sans-serif;fill:#14202d}
.subtitle{font:17px "DejaVu Sans",Arial,sans-serif;fill:#536273}
.col{font:700 18px "DejaVu Sans",Arial,sans-serif;fill:#334155}
.num{font:17px "DejaVu Sans",Arial,sans-serif;fill:#64748b}
.name{font:600 20px "DejaVu Sans",Arial,sans-serif;fill:#1f2937}
.formula{font:21px "DejaVu Serif","Times New Roman",serif;fill:#172554}
.note{font:15px "DejaVu Sans",Arial,sans-serif;fill:#536273}
.rule{fill:none;stroke:#e2e8f0;stroke-width:1}
</style>
<rect width="1300" height="890" fill="#ffffff"/>
<text class="title" x="55" y="64">Onze famílias de equações alométricas</text>
<text class="subtitle" x="55" y="100">Chatziathanasiou et al. (2024) · largura da copa (CW) em função da altura (H)</text>
<rect x="34" y="118" width="1232" height="40" fill="#eaf0f6"/>
<text class="col" x="65" y="145">Nº</text>
<text class="col" x="160" y="145">Família de modelo</text>
<text class="col" x="590" y="145">Equação (CW em função de H)</text>
<rect x="34" y="158" width="1232" height="55"/><text x="65" y="195" class="num">01</text><text x="160" y="195" class="name">Linear</text><text x="590" y="195" class="formula">CW = b₀ + b₁H</text><path d="M34 213 H1266" class="rule"/>
<rect x="34" y="214" width="1232" height="55" fill="#fafbfc"/><text x="65" y="251" class="num">02</text><text x="160" y="251" class="name">Logarítmica</text><text x="590" y="251" class="formula">CW = b₀ + b₁ ln(H)</text><path d="M34 269 H1266" class="rule"/>
<rect x="34" y="270" width="1232" height="55"/><text x="65" y="307" class="num">03</text><text x="160" y="307" class="name">Inversa</text><text x="590" y="307" class="formula">CW = b₀ + b₁/H</text><path d="M34 325 H1266" class="rule"/>
<rect x="34" y="326" width="1232" height="55" fill="#fafbfc"/><text x="65" y="363" class="num">04</text><text x="160" y="363" class="name">Quadrática</text><text x="590" y="363" class="formula">CW = b₀ + b₁H + b₂H²</text><path d="M34 381 H1266" class="rule"/>
<rect x="34" y="382" width="1232" height="55"/><text x="65" y="419" class="num">05</text><text x="160" y="419" class="name">Cúbica</text><text x="590" y="419" class="formula">CW = b₀ + b₁H + b₂H² + b₃H³</text><path d="M34 437 H1266" class="rule"/>
<rect x="34" y="438" width="1232" height="55" fill="#fafbfc"/><text x="65" y="475" class="num">06</text><text x="160" y="475" class="name">Potência</text><text x="590" y="475" class="formula">CW = b₀ × H^(b₁)</text><path d="M34 493 H1266" class="rule"/>
<rect x="34" y="494" width="1232" height="55"/><text x="65" y="531" class="num">07</text><text x="160" y="531" class="name">Composta</text><text x="590" y="531" class="formula">CW = b₀ × b₁^H</text><path d="M34 549 H1266" class="rule"/>
<rect x="34" y="550" width="1232" height="55" fill="#f1f5f9"/><text x="65" y="587" class="num">08</text><text x="160" y="587" class="name">Curva-S</text><text x="590" y="587" class="formula">CW = exp(b₀ + b₁/H)</text><path d="M34 605 H1266" class="rule"/>
<rect x="34" y="606" width="1232" height="55"/><text x="65" y="643" class="num">09</text><text x="160" y="643" class="name">Logística</text><text x="590" y="643" class="formula">CW = 1 / (1/b₀ + b₁ × b₂^H)</text><path d="M34 661 H1266" class="rule"/>
<rect x="34" y="662" width="1232" height="55" fill="#fafbfc"/><text x="65" y="699" class="num">10</text><text x="160" y="699" class="name">Crescimento</text><text x="590" y="699" class="formula">CW = exp(b₀ + b₁H)</text><path d="M34 717 H1266" class="rule"/>
<rect x="34" y="718" width="1232" height="55"/><text x="65" y="755" class="num">11</text><text x="160" y="755" class="name">Exponencial</text><text x="590" y="755" class="formula">CW = b₀ × exp(b₁H)</text><path d="M34 773 H1266" class="rule"/>
<text class="note" x="55" y="835">CW = largura da copa; H = altura; b₀, b₁, b₂ e b₃ = coeficientes dos modelos.</text>
<text class="note" x="55" y="861">As famílias foram adaptadas à modelagem de altura no projeto; os parâmetros locais foram recalibrados.</text>
</svg>