<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
<title id="title">Comparação de classificadores pelo F1-macro médio</title>
<desc id="desc">Oito classificadores comparados em blocos espaciais de 250 e 500 metros com embargo de 25 metros, cinco divisões por bloco. SVM teve o maior F1 médio nas duas escalas neste protocolo derivado.</desc>
