<title id="title">Quatro fluxos de classificação de árvores e gramíneas</title>
<desc id="description">Quadro comparativo dos métodos: Quickshift global e Random Forest; 812 quadrantes de 256 pixels; 119 recortes inteiros de 512 pixels; e os mesmos 119 recortes subdivididos em 256 pixels. Indica a segmentação, atributos, exemplos, divisão espacial, classificadores e métricas.</desc>
