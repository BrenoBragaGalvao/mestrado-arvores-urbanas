<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#173B63}
      .sub{font:500 17px Arial,sans-serif;fill:#52708d}
      .card{fill:#f8fbff;stroke:#8bbbe8;stroke-width:2}
      .num{fill:#2f80c9}
      .nt{font:700 17px Arial,sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}
      .ct{font:700 19px Arial,sans-serif;fill:#173B63}
      .cs{font:400 15px Arial,sans-serif;fill:#334e68}
      .arr{stroke:#6b9fc9;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .out{fill:#e8f4ff;stroke:#5f9bd1;stroke-width:2}
      .ot{font:700 18px Arial,sans-serif;fill:#173B63;text-anchor:middle}
      .note{font:400 14px Arial,sans-serif;fill:#5d6f80}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b9fc9"/></marker>
  </defs>

  <rect width="1600" height="860" fill="white"/>
  <text x="800" y="46" class="title" text-anchor="middle">Fluxo de Processamento em Dezessete Etapas</text>
  <text x="800" y="76" class="sub" text-anchor="middle">Abordagem orientada a objetos: Quickshift → K-Means → Random Forest → análise espacial</text>

  <!-- Row 1 -->
  <g transform="translate(35,105)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">1</text>
    <text class="ct" x="50" y="31">Preparação dos dados</text>
    <text class="cs" x="18" y="65">AOI.tif (RGB)</text><text class="cs" x="18" y="89">AOI_MULTI.tif (RGB + NIR)</text><text class="cs" x="18" y="113">AOI.shp + vetores auxiliares</text>
  </g>
  <g transform="translate(290,105)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">2</text>
    <text class="ct" x="50" y="31">Segmentação Quickshift</text>
    <text class="cs" x="18" y="68">Gerar superpixels a partir</text><text class="cs" x="18" y="92">da imagem RGB</text><text class="cs" x="18" y="116">→ objetos iniciais</text>
  </g>
  <g transform="translate(545,105)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">3</text>
    <text class="ct" x="50" y="31">Conversão para polígonos</text>
    <text class="cs" x="18" y="68">Converter segmentos em</text><text class="cs" x="18" y="92">polígonos georreferenciados</text><text class="cs" x="18" y="116">e preservar a geometria</text>
  </g>
  <g transform="translate(800,105)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">4</text>
    <text class="ct" x="50" y="31">Estatísticas espectrais</text>
    <text class="cs" x="18" y="68">Estatísticas RGB–NIR</text><text class="cs" x="18" y="92">por objeto segmentado</text><text class="cs" x="18" y="116">para descrição espectral</text>
  </g>
  <g transform="translate(1055,105)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">5</text>
    <text class="ct" x="50" y="31">Agrupamento K-Means</text>
    <text class="cs" x="18" y="68">Agrupamento não supervisionado</text><text class="cs" x="18" y="92">em 6 clusters</text><text class="cs" x="18" y="116">com base nas estatísticas</text>
  </g>
  <g transform="translate(1310,105)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">6</text>
    <text class="ct" x="50" y="31">Seleção da vegetação</text>
    <text class="cs" x="18" y="68">Selecionar o agrupamento</text><text class="cs" x="18" y="92">associado à vegetação</text><text class="cs" x="18" y="116">→ candidatos à vegetação</text>
  </g>
  <path class="arr" d="M275 180 H290"/><path class="arr" d="M530 180 H545"/><path class="arr" d="M785 180 H800"/><path class="arr" d="M1040 180 H1055"/><path class="arr" d="M1295 180 H1310"/>

  <!-- Row 2, right-to-left visual continuation -->
  <g transform="translate(1310,300)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">7</text>
    <text class="ct" x="50" y="31">Amostras de treinamento</text>
    <text class="cs" x="18" y="68">Arvores.shp e Grama.shp</text><text class="cs" x="18" y="92">para gerar rótulos</text><text class="cs" x="18" y="116">árvore × gramínea</text>
  </g>
  <g transform="translate(1055,300)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">8</text>
    <text class="ct" x="50" y="31">Características adicionais</text>
    <text class="cs" x="18" y="68">NDVI (espectral)</text><text class="cs" x="18" y="92">Brilho HSV (radiométrica)</text><text class="cs" x="18" y="116">Canny (estrutural)</text>
  </g>
  <g transform="translate(800,300)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">9</text>
    <text class="ct" x="50" y="31">Pilha de características</text>
    <text class="cs" x="18" y="68">Combinar as características</text><text class="cs" x="18" y="92">por objeto candidato</text><text class="cs" x="18" y="116">em uma única representação</text>
  </g>
  <g transform="translate(545,300)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">10</text>
    <text class="ct" x="50" y="31">Tabela de treinamento</text>
    <text class="cs" x="18" y="68">Objetos rotulados + atributos</text><text class="cs" x="18" y="92">para treinamento e teste</text><text class="cs" x="18" y="116">do classificador</text>
  </g>
  <path class="arr" d="M1430 255 V300"/><path class="arr" d="M1310 375 H1295"/><path class="arr" d="M1055 375 H1040"/><path class="arr" d="M800 375 H785"/>

  <!-- Row 3 -->
  <g transform="translate(545,495)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">11</text>
    <text class="ct" x="50" y="31">Treinamento e validação RF</text>
    <text class="cs" x="18" y="68">Random Forest (500 árvores)</text><text class="cs" x="18" y="92">treino/teste e métricas</text><text class="cs" x="18" y="116">acurácia e matriz de confusão</text>
  </g>
  <g transform="translate(800,495)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">12</text>
    <text class="ct" x="50" y="31">Classificação completa</text>
    <text class="cs" x="18" y="68">Aplicar o Random Forest</text><text class="cs" x="18" y="92">aos candidatos</text><text class="cs" x="18" y="116">→ árvore / gramínea</text>
  </g>
  <g transform="translate(1055,495)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">13</text>
    <text class="ct" x="50" y="31">Área somente das árvores</text>
    <text class="cs" x="18" y="68">Manter objetos previstos</text><text class="cs" x="18" y="92">como árvore e calcular</text><text class="cs" x="18" y="116">a área de cada polígono</text>
  </g>
  <g transform="translate(1310,495)">
    <rect class="card" rx="16" width="240" height="150"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">14</text>
    <text class="ct" x="50" y="31">Proxy de porte</text>
    <text class="cs" x="18" y="76">Ĥ = 2,5 · A^0,4</text><text class="cs" x="18" y="104">Proxy empírico de porte</text><text class="cs" x="18" y="128">a partir da área da copa</text>
  </g>
  <path class="arr" d="M665 450 V495"/><path class="arr" d="M785 570 H800"/><path class="arr" d="M1040 570 H1055"/><path class="arr" d="M1295 570 H1310"/>

  <!-- Row 4 right-to-left -->
  <g transform="translate(1310,690)">
    <rect class="card" rx="16" width="240" height="120"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">15</text>
    <text class="ct" x="50" y="31">Triagem por porte</text>
    <text class="cs" x="18" y="70">Limiar operacional:</text><text class="cs" x="18" y="96">manter objetos com Ĥ &gt; 7</text>
  </g>
  <g transform="translate(1055,690)">
    <rect class="card" rx="16" width="240" height="120"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">16</text>
    <text class="ct" x="50" y="31">Sobreposição com a rede</text>
    <text class="cs" x="18" y="70">Linhas.shp + Postes.shp</text><text class="cs" x="18" y="96">sobrepor objetos filtrados</text>
  </g>
  <g transform="translate(800,690)">
    <rect class="card" rx="16" width="240" height="120"/><circle class="num" cx="24" cy="24" r="17"/><text class="nt" x="24" y="24">17</text>
    <text class="ct" x="50" y="31">Triagem de proximidade</text>
    <text class="cs" x="18" y="70">Interseção e distâncias</text><text class="cs" x="18" y="96">de até 1 m, 3 m e 5 m</text>
  </g>
  <path class="arr" d="M1430 645 V690"/><path class="arr" d="M1310 750 H1295"/><path class="arr" d="M1055 750 H1040"/>

  <rect class="out" rx="14" x="35" y="690" width="700" height="120"/>
  <text class="ot" x="385" y="728">Saída</text>
  <text class="ot" x="385" y="760">Árvores urbanas georreferenciadas filtradas por proxy de porte</text>
  <text class="ot" x="385" y="790">e avaliadas quanto à proximidade com a infraestrutura elétrica</text>
  <path class="arr" d="M800 750 H735"/>

  <text x="35" y="840" class="note">Observação: Ĥ é um proxy empírico de porte baseado na área do objeto; não representa altura métrica validada em campo.</text>
</svg>